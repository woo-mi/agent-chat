<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chat — new</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #FFFFFF;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; background: none; border: none; cursor: pointer; }

  /* ---------- Left rail ---------- */
  .rail {
    position: fixed; left: 0; top: 0; bottom: 0;
    width: 48px;
    background: rgba(245, 245, 245, 0.82);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-right: 1px solid #E6E6E6;
    z-index: 10;
  }
  .rail-logo {
    position: absolute; left: 4px; top: 8px;
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
  }
  .rail-nav {
    position: absolute; left: 0; top: 59px;
    width: 48px;
    display: flex; flex-direction: column; align-items: center;
  }
  .rail-btn {
    width: 36px; height: 36px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px;
    transition: background-color 0.12s ease;
  }
  .rail-btn:hover { background: #E9E9E9; }
  .rail-divider { position: absolute; left: 10px; top: 352px; width: 28px; height: 1px; background: rgba(15, 17, 40, 0.08); }
  .rail-search { position: absolute; left: 6px; top: 365px; }
  .rail-bell { position: absolute; left: 6px; bottom: 56px; }
  .bell-wrap { position: relative; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
  .bell-badge {
    position: absolute; top: -3px; right: -3px;
    min-width: 15px; height: 15px;
    display: flex; align-items: center; justify-content: center;
    padding: 0 3px;
    border-radius: 6px;
    background: #F04438;
    border: 2px solid #FFFFFF;
    color: #FFFFFF;
    font-size: 9px; font-weight: 600; line-height: 100%;
  }
  .rail-avatar { position: absolute; left: 4px; bottom: 16px; width: 40px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .avatar-circle {
    width: 20px; height: 20px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    background: #FBE6F5;
    border: 1px solid #E7B8DE;
    color: #9E168E;
    font-size: 11px; font-weight: 600; line-height: 16px;
    font-family: system-ui, sans-serif;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: fixed; top: 0; left: 48px; right: 0;
    z-index: 8;
    height: 48px;
    display: flex; align-items: center;
    gap: 8px;
    padding: 0 14px;
    background: #FFFFFF;
  }
  .topbar .label { font-size: 14px; line-height: 20px; color: #171717; }

  /* ---------- Thread ---------- */
  .stage {
    margin-left: 48px;
    padding: 48px 24px 150px;
    display: flex;
    justify-content: center;
  }
  .thread { position: relative; width: 768px; flex-shrink: 0; }
  .thread img { display: block; width: 768px; height: auto; }

  /* ---------- Artifact card (real HTML over the image) ---------- */
  .artifact-card {
    position: absolute;
    left: 20px; top: 2867px;
    width: 728px; height: 84px;
    border-radius: 20px;
    background: #FFFFFF;
    border: 1px solid #ECEEF4;
  }
  .ac-icon {
    position: absolute; left: 19px; top: 14px;
    width: 53px; height: 54px;
    border-radius: 14px;
    background: rgba(26, 26, 26, 0.04);
    display: flex; align-items: center; justify-content: center;
  }
  .ac-text { position: absolute; left: 88px; top: 22px; display: flex; flex-direction: column; gap: 1px; }
  .ac-title { font-size: 15px; line-height: 20px; font-weight: 500; color: #1A1A1A; }
  .ac-sub { font-size: 13px; line-height: 17px; color: #8A8F98; }
  .ac-actions { position: absolute; right: 20px; top: 22px; display: flex; gap: 10px; }
  .btn-create-agent {
    height: 38px;
    display: flex; align-items: center; justify-content: center;
    gap: 6px;
    padding: 9px 14px;
    border-radius: 10px;
    background: #FFFFFF;
    border: 1px solid #D5D8E0;
    font-size: 14px; font-weight: 500; line-height: 16px;
    color: #374151;
    transition: background-color 0.12s ease;
  }
  .btn-create-agent:hover { background: #F7F8FA; }
  .btn-open-report {
    height: 38px;
    display: flex; align-items: center; justify-content: center;
    gap: 8px;
    padding: 9px 14px;
    border-radius: 10px;
    background: #808AFF;
    font-size: 14px; font-weight: 500; line-height: 16px;
    color: #FFFFFF;
    transition: background-color 0.12s ease;
  }
  .btn-open-report:hover { background: #6F7AF5; }

  /* ---------- "Choose how to build" popover (Chat - new - clicked) ---------- */
  .build-popover {
    position: absolute;
    bottom: calc(100% + 6px);
    left: 0;
    width: 558px;
    padding: 16px;
    border-radius: 12px;
    background: #FFFFFF;
    box-shadow: 0 4px 16px rgba(16, 24, 40, 0.12), 0 1px 3px rgba(16, 24, 40, 0.08), 0 0 0 1px rgba(16, 24, 40, 0.05);
    display: none;
    z-index: 20;
  }
  .artifact-card.popover-open .build-popover { display: block; }
  .bp-title { font-size: 15px; font-weight: 600; line-height: 20px; color: #171717; margin-bottom: 12px; }
  .bp-cards { display: flex; gap: 8px; }
  .bp-card {
    flex: 1;
    display: grid;
    grid-template-columns: 16px 1fr;
    column-gap: 8px;
    align-items: start;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #E3E3E3;
    background: #FFFFFF;
    cursor: pointer;
    transition: background-color 0.12s ease;
  }
  .bp-card:hover { background: #FAFAFA; }
  .bp-card.selected { border: 1.5px solid #171717; padding: 9.5px 11.5px; }
  .bp-card svg { margin-top: 1px; }
  .bp-card-title { font-size: 14px; font-weight: 600; line-height: 18px; color: #171717; }
  .bp-card-sub { grid-column: 2; font-size: 12.5px; line-height: 16px; color: #666666; margin-top: 2px; }

  /* ---------- Bottom fade + composer ---------- */
  .conv-fade {
    position: fixed;
    bottom: 0; left: 48px; right: 0;
    height: 130px;
    background: linear-gradient(to top, #FFFFFF 55%, rgba(255, 255, 255, 0));
    pointer-events: none;
    z-index: 5;
  }
  .conv-composer {
    position: fixed;
    bottom: 26px; left: calc(50% + 24px);
    transform: translateX(-50%);
    z-index: 6;
    width: 800px;
    max-width: calc(100vw - 96px);
    padding: 12px 14px 10px;
    border-radius: 20px;
    background: #FFFFFF;
    border: 1px solid #BFC1CF;
    box-shadow: inset 0 1px 4px rgba(255, 255, 255, 0.25), 0 4px 8px rgba(0, 0, 0, 0.05), 0 1px 4px rgba(0, 0, 0, 0.04);
  }
  .conv-composer-placeholder {
    padding: 4px 9px 5px;
    font-size: 16px; font-weight: 500; line-height: 20px;
    color: #333444;
    opacity: 0.42;
    margin-bottom: 4px;
  }
  .conv-composer-controls { display: flex; align-items: center; gap: 4px; }
  .conv-domain-chip {
    display: inline-flex; align-items: center;
    gap: 4px;
    min-height: 28px;
    padding: 4px 10px;
    border-radius: 50px;
    font-size: 14px; font-weight: 500; line-height: 130%;
    color: rgba(20, 24, 31, 0.7);
  }
  .conv-controls-right { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  .conv-thinking {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 6px;
    padding: 5px 10px 5px 14px;
    border-radius: 50px;
    font-size: 14px; font-weight: 500;
    color: rgba(20, 24, 31, 0.7);
  }
  .conv-icon-btn { display: inline-flex; align-items: center; justify-content: center; padding: 5px; border-radius: 50%; }
  .conv-send {
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    background: rgba(236, 238, 244, 0.6);
  }
</style>
</head>

<script>
  // land at the bottom of the thread, matching the frame's viewport
  window.scrollTo(0, document.documentElement.scrollHeight);
  window.addEventListener('load', function () {
    window.scrollTo(0, document.documentElement.scrollHeight);
  });

  // Create Agent -> "Choose how to build" popover (Chat - new - clicked)
  var artifactCard = document.getElementById('artifactCard');
  document.getElementById('btnCreateAgent').addEventListener('click', function (e) {
    e.stopPropagation();
    artifactCard.classList.toggle('popover-open');
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('#buildPopover')) artifactCard.classList.remove('popover-open');
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') artifactCard.classList.remove('popover-open');
  });
</script>
